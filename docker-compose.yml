services:
  postgres:
    image: postgres:16
    container_name: arcagent-postgres
    environment:
      POSTGRES_USER: arcagent
      POSTGRES_PASSWORD: arcagent
      POSTGRES_DB: arcagent
    ports:
      - "5432:5432"
    volumes:
      - arcagent-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcagent -d arcagent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arcagent-pgdata:
