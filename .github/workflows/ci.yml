name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev,agent,dashboard]"

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Test
        run: .venv/bin/pytest -q

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:next

  staging-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build staging image
        run: docker build --tag arcagent-staging:ci --file deploy/Dockerfile .
      - name: Verify packaged application and migrations without vendors
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            --env DATABASE_URL=sqlite:////tmp/image-smoke.db \
            arcagent-staging:ci sh -c 'alembic upgrade head && python -c "from arcagent.app import app; assert any(route.path == \"/api/console/followups\" for route in app.routes)" && python -m scripts.verify_staging --help'
